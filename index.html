<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Birthday List</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --navy:#182635; --gold:#c99a3d; --cream:#f6f2ea; --ink:#24303d;
    --muted:#6b7686; --line:#dfd8c8; --white:#ffffff; --warn-bg:#fbf1de; --warn-text:#8a5a00;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);}
  header{background:var(--navy);color:var(--cream);padding:2.2rem 1.5rem 2rem;}
  header h1{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:2rem;margin:0 0 .25rem;}
  header p{margin:0;color:#b8c2cf;font-size:.95rem;}
  main{max-width:900px;margin:0 auto;padding:2rem 1.25rem 4rem;}
  .banner{background:var(--warn-bg);color:var(--warn-text);border:1px solid #e9d4a3;border-radius:6px;padding:.7rem 1rem;font-size:.9rem;margin-bottom:1.2rem;display:none;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;}
  .cat-card{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:1.4rem 1.1rem;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s;}
  .cat-card:hover{border-color:var(--gold);}
  .cat-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .cat-card .cat-name{font-family:Georgia,serif;font-size:1.2rem;margin:0 0 .3rem;}
  .cat-card .cat-count{color:var(--muted);font-size:.85rem;}
  .cat-card .cat-note{color:var(--warn-text);font-size:.78rem;margin:.5rem 0 0;font-weight:600;}

  .back-btn{background:none;border:none;color:var(--navy);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:1.2rem;}
  .back-btn:hover{text-decoration:underline;}
  .detail-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.75rem;margin-bottom:1.4rem;}
  .detail-head h2{font-family:Georgia,serif;font-size:1.6rem;margin:0;}
  .sort-controls select{border:1px solid var(--line);border-radius:4px;padding:.4rem .6rem;font:inherit;background:var(--white);}

  .item-list{display:flex;flex-direction:column;gap:.9rem;}
  .item-card{background:var(--white);border:1px solid var(--line);border-radius:6px;display:flex;gap:1rem;padding:1rem;}
  .item-card.purchased{opacity:.5;}
  .item-img{width:88px;height:88px;flex:none;border-radius:4px;object-fit:cover;background:#eee5d3;}
  .item-body{flex:1;min-width:0;}
  .item-top{display:flex;justify-content:space-between;gap:.5rem;}
  .item-name{font-weight:600;margin:0 0 .2rem;}
  .item-name a{color:var(--ink);text-decoration:none;}
  .item-name a:hover{color:var(--gold);text-decoration:underline;}
  .price{font-weight:600;color:var(--navy);white-space:nowrap;}
  .sizes{color:var(--muted);font-size:.85rem;margin:.2rem 0 0;}
  .fav-star{color:var(--gold);margin-left:.3rem;}
  .item-actions{display:flex;align-items:center;gap:.9rem;margin-top:.6rem;font-size:.85rem;flex-wrap:wrap;}
  .item-actions label{display:flex;align-items:center;gap:.4rem;cursor:pointer;color:var(--muted);}
  .item-actions input{width:16px;height:16px;accent-color:var(--gold);}
  .buy-link{font-size:.85rem;color:var(--navy);font-weight:600;text-decoration:none;border:1px solid var(--line);padding:.3rem .6rem;border-radius:4px;}
  .buy-link:hover{border-color:var(--gold);}
  .hidden{display:none;}
  .empty{color:var(--muted);font-style:italic;}
</style>
</head>
<body>

<header>
  <h1>My Birthday List</h1>
  <p>Pick a category to see what I'm hoping for. Purchases sync live for everyone viewing this page.</p>
</header>

<main>
  <div id="configWarning" class="banner"></div>

  <div id="categoriesView">
    <div class="grid" id="categoryGrid"></div>
  </div>

  <div id="detailView" class="hidden">
    <button class="back-btn" onclick="showCategories()">&larr; All categories</button>
    <div class="detail-head">
      <h2 id="detailTitle"></h2>
      <div class="sort-controls">
        <select id="sortSelect" onchange="renderItems()">
          <option value="favorite">Favorites first</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </div>
    </div>
    <div class="item-list" id="itemList"></div>
  </div>
</main>

<script>
/* ---------------------------------------------------------------
   STEP 1: PASTE YOUR FIREBASE CONFIG BELOW.
   Get this from: console.firebase.google.com -> create a project ->
   Build > Firestore Database (create in test mode) -> Project
   settings > General > "Your apps" > Web app > copy the config object.
------------------------------------------------------------------*/
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};

/* ---------------------------------------------------------------
   STEP 2: EDIT YOUR LIST HERE.
   Each item: name, image (a URL), url (where to buy), price (number),
   sizes (optional string), favorite (true/false).
------------------------------------------------------------------*/
const categories = [
  {
    id: "shoes",
    name: "Shoes",
    items: [
      { name: "Nike Air Zoom Pegasus", image: "https://via.placeholder.com/200x200.png?text=Pegasus", url: "https://www.nike.com", price: 130, sizes: "10, 10.5", favorite: true },
      { name: "New Balance 990v6", image: "https://via.placeholder.com/200x200.png?text=NB+990", url: "https://www.newbalance.com", price: 200, sizes: "10", favorite: false }
    ]
  },
  {
    id: "books",
    name: "Books",
    items: [
      { name: "Project Hail Mary", image: "https://via.placeholder.com/200x200.png?text=Book", url: "https://bookshop.org", price: 18, sizes: "", favorite: true }
    ]
  },
  {
    id: "home",
    name: "Home & Kitchen",
    items: [
      { name: "Ceramic Pour-Over Set", image: "https://via.placeholder.com/200x200.png?text=Pour-Over", url: "https://example.com", price: 45, sizes: "", favorite: false }
    ]
  }
];
/* ------------------------------------------------------------- */

let currentCategory = null;
let purchasedByCat = {};   // { catId: Set(itemName) }
let db = null;

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }
function docId(catId, itemName){ return catId + "__" + slug(itemName); }

function initFirebase(){
  if(firebaseConfig.apiKey.startsWith("PASTE_")){
    const w = document.getElementById("configWarning");
    w.textContent = "Firebase isn't configured yet, so purchases won't sync between visitors. Add your firebaseConfig values near the top of the script.";
    w.style.display = "block";
    renderCategories();
    return;
  }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.collection("purchased").onSnapshot(snap => {
    const next = {};
    snap.forEach(doc => {
      const d = doc.data();
      if(!next[d.catId]) next[d.catId] = new Set();
      next[d.catId].add(d.itemName);
    });
    purchasedByCat = next;
    renderCategories();
    if(currentCategory) renderItems();
  }, err => {
    const w = document.getElementById("configWarning");
    w.textContent = "Couldn't connect to Firebase (" + err.message + "). Check your config and Firestore rules.";
    w.style.display = "block";
  });
}

function renderCategories(){
  const grid = document.getElementById("categoryGrid");
  grid.innerHTML = "";
  const withNone = categories.filter(c => !(purchasedByCat[c.id] && purchasedByCat[c.id].size));
  const withSome = categories.filter(c => purchasedByCat[c.id] && purchasedByCat[c.id].size);
  [...withNone, ...withSome].forEach(cat => {
    const hasPurchase = purchasedByCat[cat.id] && purchasedByCat[cat.id].size;
    const btn = document.createElement("button");
    btn.className = "cat-card";
    btn.onclick = () => showDetail(cat.id);
    btn.innerHTML = `<p class="cat-name">${cat.name}</p><p class="cat-count">${cat.items.length} item${cat.items.length===1?"":"s"}</p>`
      + (hasPurchase ? `<p class="cat-note">A gift from this category has already been purchased</p>` : "");
    grid.appendChild(btn);
  });
}

function showCategories(){
  currentCategory = null;
  document.getElementById("detailView").classList.add("hidden");
  document.getElementById("categoriesView").classList.remove("hidden");
}

function showDetail(catId){
  currentCategory = categories.find(c => c.id === catId);
  document.getElementById("detailTitle").textContent = currentCategory.name;
  document.getElementById("categoriesView").classList.add("hidden");
  document.getElementById("detailView").classList.remove("hidden");
  document.getElementById("sortSelect").value = "favorite";
  renderItems();
}

function isPurchased(catId, itemName){
  return !!(purchasedByCat[catId] && purchasedByCat[catId].has(itemName));
}

function togglePurchased(catId, itemName, checked){
  if(!db) return;
  const ref = db.collection("purchased").doc(docId(catId, itemName));
  if(checked) ref.set({ catId, itemName, purchasedAt: Date.now() });
  else ref.delete();
}

function renderItems(){
  if(!currentCategory) return;
  const sortMode = document.getElementById("sortSelect").value;
  let items = [...currentCategory.items];
  if(sortMode === "price-asc") items.sort((a,b) => a.price - b.price);
  else if(sortMode === "price-desc") items.sort((a,b) => b.price - a.price);
  else items.sort((a,b) => (b.favorite - a.favorite));

  const list = document.getElementById("itemList");
  list.innerHTML = "";
  if(items.length === 0){
    list.innerHTML = '<p class="empty">No items in this category yet.</p>';
    return;
  }
  items.forEach(item => {
    const bought = isPurchased(currentCategory.id, item.name);
    const card = document.createElement("div");
    card.className = "item-card" + (bought ? " purchased" : "");
    card.innerHTML = `
      <img class="item-img" src="${item.image}" alt="${item.name}">
      <div class="item-body">
        <div class="item-top">
          <p class="item-name"><a href="${item.url}" target="_blank" rel="noopener">${item.name}</a>${item.favorite ? '<span class="fav-star" title="Favorite">&#9733;</span>' : ''}</p>
          <span class="price">$${item.price.toFixed(2)}</span>
        </div>
        ${item.sizes ? `<p class="sizes">Size: ${item.sizes}</p>` : ""}
        <div class="item-actions">
          <a class="buy-link" href="${item.url}" target="_blank" rel="noopener">View / buy</a>
          <label><input type="checkbox" ${bought ? "checked" : ""} onchange="togglePurchased('${currentCategory.id}', '${item.name.replace(/'/g,"\\'")}', this.checked)"> Mark as purchased</label>
        </div>
      </div>`;
    list.appendChild(card);
  });
}

initFirebase();
</script>
</body>
</html>
